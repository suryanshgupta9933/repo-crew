<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="430" rx="16" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="15.5" fill="none" stroke="#1e293b"/>

  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="650">What lands in your repo</text>
  <text x="44" y="79" fill="#64748b" font-size="13.5">Ordinary files. Reviewable in a pull request.</text>

  <!-- tree panel -->
  <rect x="44" y="104" width="404" height="290" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
    <text x="70" y="138" fill="#64748b">your-repo/</text>
    <text x="70" y="166" fill="#60a5fa">├── .claude/agents/</text>
    <text x="98" y="194" fill="#e2e8f0">└── side-panel-ui.md</text>
    <text x="70" y="222" fill="#60a5fa">├── docs/crew/</text>
    <text x="98" y="250" fill="#e2e8f0">├── side-panel-ui.md</text>
    <text x="98" y="278" fill="#e2e8f0">├── DECISIONS.md</text>
    <text x="98" y="306" fill="#e2e8f0">└── ROSTER.md</text>
    <text x="70" y="334" fill="#60a5fa">└── CLAUDE.md</text>
  </g>

  <!-- annotations -->
  <g font-size="13.5">
    <circle cx="482" cy="136" r="4" fill="#60a5fa"/>
    <path d="M482 136 H494" stroke="#334155" stroke-width="1.5"/>
    <text x="506" y="132" fill="#f1f5f9" font-weight="600">One agent per domain</text>
    <text x="506" y="153" fill="#64748b" font-size="12.5">short prompt, sharp trigger words</text>

    <circle cx="482" cy="208" r="4" fill="#34d399"/>
    <path d="M482 208 H494" stroke="#334155" stroke-width="1.5"/>
    <text x="506" y="204" fill="#f1f5f9" font-weight="600">Its knowledge file</text>
    <text x="506" y="225" fill="#64748b" font-size="12.5">invariants, gotchas, how to run it</text>

    <circle cx="482" cy="280" r="4" fill="#fbbf24"/>
    <path d="M482 280 H494" stroke="#334155" stroke-width="1.5"/>
    <text x="506" y="276" fill="#f1f5f9" font-weight="600">Decision ledger</text>
    <text x="506" y="297" fill="#64748b" font-size="12.5">locked, proposed, and why</text>

    <circle cx="482" cy="352" r="4" fill="#f472b6"/>
    <path d="M482 352 H494" stroke="#334155" stroke-width="1.5"/>
    <text x="506" y="348" fill="#f1f5f9" font-weight="600">Routing block</text>
    <text x="506" y="369" fill="#64748b" font-size="12.5">a few lines between markers</text>
  </g>
</svg>
