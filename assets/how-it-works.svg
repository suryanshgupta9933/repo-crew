<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="980" height="330" rx="16" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="979" height="329" rx="15.5" fill="none" stroke="#1e293b"/>

  <text x="48" y="60" fill="#f8fafc" font-size="22" font-weight="650">One audit, then a crew that fits your repo</text>
  <text x="48" y="86" fill="#64748b" font-size="14">Nothing is written until you approve the plan.</text>

  <!-- 1 -->
  <g>
    <text x="48" y="140" fill="#60a5fa" font-size="34" font-weight="700">1</text>
    <text x="48" y="168" fill="#f1f5f9" font-size="17" font-weight="600">Survey</text>
    <text x="48" y="192" fill="#94a3b8" font-size="13">Maps units, churn,</text>
    <text x="48" y="210" fill="#94a3b8" font-size="13">co-change and CI.</text>
  </g>

  <!-- 2 -->
  <g>
    <text x="284" y="140" fill="#34d399" font-size="34" font-weight="700">2</text>
    <text x="284" y="168" fill="#f1f5f9" font-size="17" font-weight="600">Plan</text>
    <text x="284" y="192" fill="#94a3b8" font-size="13">You approve the agents</text>
    <text x="284" y="210" fill="#94a3b8" font-size="13">and the paths they own.</text>
  </g>

  <!-- 3 -->
  <g>
    <text x="520" y="140" fill="#fbbf24" font-size="34" font-weight="700">3</text>
    <text x="520" y="168" fill="#f1f5f9" font-size="17" font-weight="600">Generate</text>
    <text x="520" y="192" fill="#94a3b8" font-size="13">Agents, knowledge files,</text>
    <text x="520" y="210" fill="#94a3b8" font-size="13">decision ledger.</text>
  </g>

  <!-- 4 -->
  <g>
    <text x="756" y="140" fill="#f472b6" font-size="34" font-weight="700">4</text>
    <text x="756" y="168" fill="#f1f5f9" font-size="17" font-weight="600">Route</text>
    <text x="756" y="192" fill="#94a3b8" font-size="13">A thin orchestrator</text>
    <text x="756" y="210" fill="#94a3b8" font-size="13">dispatches the work.</text>
  </g>

  <!-- connectors -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <path d="M48 226 H932"/>
  </g>
  <g fill="#334155">
    <circle cx="48" cy="226" r="3.5"/>
    <circle cx="284" cy="226" r="3.5"/>
    <circle cx="520" cy="226" r="3.5"/>
    <circle cx="756" cy="226" r="3.5"/>
  </g>

  <!-- footnote -->
  <g font-size="12.5">
    <rect x="48" y="248" width="196" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="64" y="267"><tspan fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[code]</tspan><tspan fill="#94a3b8"> read from the code</tspan></text>

    <rect x="256" y="248" width="168" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="272" y="267"><tspan fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[user]</tspan><tspan fill="#94a3b8"> you said so</tspan></text>

    <rect x="436" y="248" width="232" height="28" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="452" y="267"><tspan fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">[inferred]</tspan><tspan fill="#94a3b8"> needs confirming</tspan></text>
  </g>

  <text x="48" y="302" fill="#475569" font-size="12.5">The audit decides the crew size. A small CLI might get two agents; a multi-runtime product might get twelve.</text>

  <text x="48" y="300" fill="#475569" font-size="12.5">The audit decides the crew size. A small CLI might get two agents; a multi-runtime product might get twelve.</text>
</svg>
